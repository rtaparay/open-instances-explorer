<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="style.css">
</head><body>
<title>Instance Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">


<header class="topbar">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></span>
    <div style="min-width:0"><h1>Instance <b>Explorer</b></h1><div class="sub">specs y precios por servicio</div></div>
  </div>
  <button class="icon-btn" id="sideBtn" title="Ocultar/mostrar menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
  <button class="icon-btn" id="homeBtn" title="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></button>
  <button class="icon-btn" id="filterBtn" title="Filtros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg></button>
  <div class="topsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="gsearch" type="search" placeholder="Buscar tipos de instancia…" autocomplete="off" spellcheck="false"></div>
  <span class="spacer"></span>
  <span class="region"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><select id="region" aria-label="Región AWS"></select></span>
  <button class="icon-btn" id="themeBtn" title="Cambiar tema"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
</header>

<div class="filterpop" id="filterpop" hidden>
  <div class="fh">Filtros</div>
  <label>vCPU mínimo<input id="fv" type="number" min="0" placeholder="0"></label>
  <label>RAM mínima (GiB)<input id="fm" type="number" min="0" placeholder="0"></label>
  <label>Presupuesto máx. ($/mes)<input id="fmo" type="number" min="0" placeholder="∞"></label>
  <button class="fclear" id="fclear">Limpiar</button>
</div>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>


<script src="app.js"></script>
</body></html>
